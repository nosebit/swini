<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download Swini</title>
  <meta name="description" content="Download Swini, the distributed workload orchestrator and supervisor." />
  <meta property="og:title" content="Download Swini" />
  <meta property="og:description" content="A distributed workload orchestrator and supervisor." />
  <meta property="og:url" content="https://swini.io" />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // Apply saved theme immediately to avoid flash
    (function () {
      const saved = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (saved === "dark" || (!saved && prefersDark)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>

<body>
  <header>
    <nav>
      <a href="/" class="logo-link">
        <img src="logo.png" alt="Swini" class="logo-img" />
      </a>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark mode">
        <!-- Sun icon (shown in dark mode) -->
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
        </svg>
        <!-- Moon icon (shown in light mode) -->
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
        </svg>
      </button>
    </nav>
  </header>

  <main>
    <h1>Download Swini</h1>

    <div class="install-section">
      <div class="install-box">
        <code class="command-text" id="cmdText">curl -fsSL https://get.swini.io/install.sh | bash</code>
        <button class="copy-btn" id="copyBtn" aria-label="Copy install command">
          <svg class="icon-copy" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75" />
          </svg>
          <svg class="icon-check" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
          </svg>
        </button>
      </div>
      <p class="install-hint">Paste this in your terminal</p>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <span class="footer-copy">© 2026 Nosebit</span>
      <div class="footer-links">
        <a href="https://github.com/nosebit/swini">GitHub</a>
        <a href="https://github.com/nosebit/swini/releases">Releases</a>
        <a href="https://github.com/nosebit/swini/issues">Issues</a>
      </div>
    </div>
  </footer>

  <script>
    // Theme toggle
    const toggle = document.getElementById("themeToggle");
    toggle.addEventListener("click", () => {
      const html = document.documentElement;
      const isDark = html.getAttribute("data-theme") === "dark";
      if (isDark) {
        html.removeAttribute("data-theme");
        localStorage.setItem("theme", "light");
      } else {
        html.setAttribute("data-theme", "dark");
        localStorage.setItem("theme", "dark");
      }
    });

    // Copy to clipboard
    const copyBtn = document.getElementById("copyBtn");
    const cmdText = document.getElementById("cmdText").innerText;

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(cmdText);
        copyBtn.classList.add("copied");
        setTimeout(() => copyBtn.classList.remove("copied"), 2000);
      } catch (err) {
        console.error("Failed to copy:", err);
      }
    });
  </script>
</body>

</html>
