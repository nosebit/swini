[package]
name = "swini"
version = "0.1.0"
edition = "2021"

[lints.rust]
dead_code = "allow"

[lints.clippy]
result_large_err = "allow"
enum_variant_names = "allow"
module_inception = "allow"

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
daemonize = "0.5.0"
libc = "0.2.169"
openraft = { version = "0.9.25", features = ["serde", "storage-v2"] }
prost = "0.14.4"
rand = "0.10.2"
redb = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yml = "0.0.12"
tokio = { version = "1.53.1", features = ["full"] }
tonic = { version = "0.14.6", features = ["channel"] }
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono", "local-time"] }

[build-dependencies]
tonic-prost-build = "0.14.6"

[[bin]]
name = "swini"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
tokio-stream = "0.1.19"
