[package]
name = "swini"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono", "local-time"] }

[[bin]]
name = "swini"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
