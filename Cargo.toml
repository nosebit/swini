[package]
name = "swini"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive"] }
openraft = { version = "0.9.25", features = ["serde", "storage-v2"] }
prost = "0.14.4"
redb = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tonic = { version = "0.14.6", features = ["channel"] }
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono", "local-time"] }

[build-dependencies]
tonic-prost-build = "0.14.6"

[[bin]]
name = "swini"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
tokio-stream = "0.1.19"
