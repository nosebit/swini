name: 🐛 Bug report
description: Create a report to help us improve Swini
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you so much for taking the time to fill out this bug report! Swini 🐷 depends on efforts like this to keep improving so we are deeply grateful for your contribution.
  - type: input
    id: version
    attributes:
      label: Version
      description:
        What version of Swini showed this miss behavior? (e.g., `swini
        --version` or v0.1.0)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description:
        A clear and concise description of what was expected instead of what
        happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description:
        How can the bug be reproduced? Please provide any relevant code snippets
        or command invocations.
      placeholder: |
        1. Run 'swini daemon start'
        2. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output or terminal traces
      description:
        Please copy and paste any relevant log output. This will be
        automatically formatted into code, so no need for backticks.
      render: shell
